{{define "forgot_password"}}{{template "layout_head" .}}
<div class="recovery-page" id="forgot-password-page">
  <div class="account-lead">
    <span class="account-kicker">ACCOUNT RECOVERY</span>
    <p class="account-copy">Enter the email address associated with your account. We’ll send a reset link if an account matches.</p>
  </div>
  <form id="forgot-password-form" class="form" novalidate>
    <label class="field">
      <span class="field__label">Email address</span>
      <input class="field__input" id="forgot-password-email" type="email"
             autocomplete="email" inputmode="email" required autofocus>
    </label>
    <button class="button button--primary" id="forgot-password-submit" type="submit">Send reset link</button>
  </form>
  <p class="alert alert--info recovery-status" id="forgot-password-status" role="status" aria-live="polite" hidden></p>
  <p class="links">
    <a href="/login">Back to sign in</a>
    <span aria-hidden="true"> &middot; </span>
    <a href="/signup">Create an account</a>
  </p>
</div>
<script nonce="{{.Nonce}}" src="/assets/playground.js"></script>
{{template "layout_foot" .}}{{end}}
