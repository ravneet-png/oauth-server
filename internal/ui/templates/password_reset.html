{{define "password_reset"}}{{template "layout_head" .}}
<div class="recovery-page" id="password-reset-page"
     data-reset-token="{{.Token}}"
     data-min-password-length="{{.MinPasswordLen}}">
  <div class="account-lead">
    <span class="account-kicker">ACCOUNT RECOVERY</span>
    <p class="account-copy">Choose a new password. This one-time link can only be used once.</p>
  </div>
  <form id="password-reset-form" class="form" novalidate>
    <label class="field">
      <span class="field__label">New password</span>
      <input class="field__input" id="password-reset-password" type="password"
             autocomplete="new-password" required minlength="{{.MinPasswordLen}}">
      <span class="field__hint">At least {{.MinPasswordLen}} characters.</span>
    </label>
    <label class="field">
      <span class="field__label">Confirm new password</span>
      <input class="field__input" id="password-reset-confirm" type="password"
             autocomplete="new-password" required minlength="{{.MinPasswordLen}}">
    </label>
    <button class="button button--primary" id="password-reset-submit" type="submit">Update password</button>
  </form>
  <p class="alert alert--info recovery-status" id="password-reset-status" role="status" aria-live="polite" hidden></p>
</div>
<p class="links">
  <a href="/forgot-password">Request another reset link</a>
  <span aria-hidden="true"> &middot; </span>
  <a href="/login">Back to sign in</a>
</p>
<script nonce="{{.Nonce}}" src="/assets/playground.js"></script>
{{template "layout_foot" .}}{{end}}
