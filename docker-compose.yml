services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: oauth
      POSTGRES_PASSWORD: oauth
      POSTGRES_DB: oauth
    # Loopback only. Never expose the database to the LAN.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oauth -d oauth"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailhog:
    image: mailhog/mailhog:latest
    # Only the UI is published. The app reaches SMTP over the internal network as
    # mailhog:1025, so publishing 1025 to the host is unnecessary and collides with
    # any local mail service already bound to that port.
    ports:
      - "127.0.0.1:8025:8025"

  app:
    build:
      context: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      OAUTH_ENV: development
      OAUTH_CONFIG_FILE: /config.yaml
      OAUTH_SERVER_ISSUER: http://localhost:8080
      OAUTH_DATABASE_URL: postgres://oauth:oauth@postgres:5432/oauth?sslmode=disable
      OAUTH_REDIS_URL: redis://redis:6379/0
      OAUTH_EMAIL_SMTP_HOST: mailhog
      OAUTH_EMAIL_SMTP_PORT: "1025"
    volumes:
      - ./config.yaml:/config.yaml:ro
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

volumes:
  pgdata: